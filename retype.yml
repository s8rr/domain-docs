input: ./src
output: .retype
url: domain.sabbir.cc
branding:
  title: Domain Docs
  logo: /media/logo-circle.png
  logoAlign: left
  colors:
    label:
      text: "#ffffff"
      background: "#9d00ff"
links:
  - text: Home
    link: index.md
    icon: home
  - text: Website
    link: https://domain.sabbir.cc
    icon: globe
  - text: Register
    link: https://github.com/s8rr/domain
    icon: mark-github
    target: blank
  - text: Donate
    link: https://sabbir.cc/contact
    icon: heart
    target: blank
edit:
  repo: "https://github.com/is-a-dev/docs"
  base: "/src"
  branch: "main"
  label: "Edit this page"
editor:
  enabled: true
favicon: /media/logo_circle.png
generator:
  recase: all
markdown:
  lineBreaks: soft
meta:
  title: " | Domain Docs"
search:
  hotkeys:
    - "/"
  maxResults: 20
  minChars: 2
  mode: full
  noResultsFoundMsg: "No results"
  placeholder: Search
start:
  open: false
snippets:
  lineNumbers:
    - js
    - none
templating:
  enabled: true
  liquid: false
footer:
  copyright: "&copy; sabbir.cc Copyright {{ year }}. All rights reserved."
  links:
    - text: domain.sabbir.cc/docs
      link: https://github.com/s8rr/domaian-docs